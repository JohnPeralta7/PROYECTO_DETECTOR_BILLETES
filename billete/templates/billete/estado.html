{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detector de Estado de Billetes</title>
    <link rel="stylesheet" href="{% static 'billete/css/billetes.css' %}">
    <link rel="stylesheet" href="{% static 'billete/css/language-selector.css' %}">
</head>
<body>
    <!-- Selector de idioma -->
    <div class="language-selector">
        <button class="language-button">
            <span class="language-flag">🇪🇸</span>
            <span class="language-text">ES</span>
        </button>
        <div class="language-dropdown">
            <button class="language-option active" data-lang="es">
                <span class="language-flag">🇪🇸</span>
                <span data-translate="lang_spanish">Español</span>
            </button>
            <button class="language-option" data-lang="en">
                <span class="language-flag">🇬🇧</span>
                <span data-translate="lang_english">English</span>
            </button>
        </div>
    </div>

    <!-- Botón para abrir/cerrar menú -->
    <button class="menu-toggle" onclick="toggleMenu()" id="menuToggle">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <!-- Overlay -->
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <!-- Menú lateral -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header" onclick="closeMenu()">
            <span class="sidebar-icon">🛡️</span>
            <span class="sidebar-title" data-translate="menu_title">Billete Detector</span>
        </div>

        <nav class="nav-menu">
            <a href="{% url 'billete:inicio' %}" class="nav-item">
                <span class="nav-icon">🏠</span>
                <span data-translate="menu_home">Inicio</span>
            </a>
            <a href="{% url 'billete:billetes' %}" class="nav-item">
                <span class="nav-icon">💵</span>
                <span data-translate="menu_bills">Billetes</span>
            </a>
            <a href="{% url 'billete:monedas' %}" class="nav-item">
                <span class="nav-icon">🪙</span>
                <span data-translate="menu_coins">Monedas</span>
            </a>
            <a href="{% url 'billete:estado' %}" class="nav-item">
                <span class="nav-icon">📊</span>
                <span data-translate="menu_state">Estado</span>
            </a>
        </nav>
    </aside>

    <h1 data-translate="state_page_title">¡Detector de estado de billetes! 📊</h1>
    <div class="container">
        <div class="header">
            <p class="instruction" data-translate="state_instruction">Acerca tus billetes a la cámara</p>
        </div>

        <div class="main-content">
            <div class="camera-section">
                <div class="camera-placeholder">
                    <video id="video" width="320" height="240" autoplay style="width: 100%; height: auto; border-radius: 8px;"></video>
                    <img id="img-resultado" style="width: 100%; height: auto; display: none; border-radius: 8px;">
                </div>
            </div>

            <div class="bottom-section">
                <div class="buttons">
                    <button class="btn btn-scan">
                        <span class="btn-icon">📊</span>
                        <span data-translate="btn_analyze_state">Analizar<br>estado</span>
                    </button>
                    <button class="btn btn-upload">
                        <span class="btn-icon">📤</span>
                        <span data-translate="btn_upload">Subir<br>imagen</span>
                    </button>
                    <button class="btn btn-reset">
                        <span class="btn-icon">🔄</span>
                        <span data-translate="btn_reset">Reiniciar</span>
                    </button>
                </div>

                <div class="result-box">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="m21 21-4.35-4.35"/>
                    </svg>
                    <span class="result-text" data-translate="result_analyzing">Analizando estado...</span>
                </div>
            </div>
        </div>
    </div>
    {% csrf_token %}

    <input type="file" id="file-input" accept="image/*" style="display: none;">
    <script src="{% static 'billete/js/translations.js' %}"></script>
    <script src="{% static 'billete/js/menu.js' %}"></script>
    <script src="{% static 'billete/js/camara.js' %}"></script>
</body>
</html>
